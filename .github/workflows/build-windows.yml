name: Сборка Windows exe

on:
  push:
    paths:
      - 'agent-studio/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-studio/package-lock.json

      - run: npm ci

      - run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: AgentStudio-windows
          path: agent-studio/dist/*.exe
          if-no-files-found: error
          retention-days: 30
